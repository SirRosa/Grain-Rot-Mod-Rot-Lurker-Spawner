name: Inspect Rot Lurker reflection
on:
  push:
    paths:
      - ".github/workflows/inspect-reflection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Helden schema and real UE4SS object dump
        run: |
          python3 - <<'PY'
          import gzip, json, urllib.request, re
          base="https://raw.githubusercontent.com/SirRosa/Grain-Rot-Mod-Data-Base/main/data/"
          def fetch(name):
              with urllib.request.urlopen(base+name,timeout=45) as r: return r.read()
          db=json.loads(gzip.decompress(fetch("current-schema.json.gz")))
          words=("rotlurker","rot_lurker","rot lurker","enemymanager","enemyspawn","spawner","spawnpoint","enemyentry","characterpreset","dungeonactor","dungeonroom","dungeonrun")
          print("=== SCHEMA RELEVANT CLASSES ===",flush=True)
          for name,body in db["structs"].items():
              if any(w in name.lower() for w in words):
                  print(json.dumps({name:body},ensure_ascii=False)[:9000],flush=True)
          print("=== SCHEMA RELEVANT PROPS ===",flush=True)
          for name,body in db["structs"].items():
              if ("HeldenDungeon" in name or "HeldenEnemy" in name or "HeldenCharacterPreset" in name) and not any(w in name.lower() for w in words):
                  props=[p for p in body.get("properties",[]) if any(w in p["name"].lower() for w in ("enemy","spawn","preset","dungeon","rot"))]
                  if props: print(json.dumps({name:props},ensure_ascii=False)[:4000],flush=True)
          print("=== OBJECT DUMP MATCHES ===",flush=True)
          parts=b"".join(fetch("UE4SS-ObjectDump.txt.gz.part%02d"%i) for i in range(1,7))
          dump=gzip.decompress(parts).decode("utf-8","replace")
          hit=0
          for line in dump.splitlines():
              low=line.lower()
              if any(w in low for w in ("rotlurker","rot_lurker","rot lurker","enemyspawn","heldendungeonenemymanager","heldendungeonspawner","enemyentry","spawncharacter")):
                  print(line[:750],flush=True)
                  hit+=1
                  if hit>=230:
                      print("TRUNCATED AT 230 MATCHES")
                      break
          print("MATCHES",hit)
          print("=== MORE EXACT SCHEMA ===")
          for name in ["HeldenEnemyEncounterEntry","HeldenEnemyEncounter","HeldenDataSingleton","HeldenCharacter","HeldenGameMode","HeldenCheatManager","HeldenCharacterPresetContainer","HeldenEnemyEncounterTable","HeldenDungeonLevelData"]:
              if name in db["structs"]:
                  print(json.dumps({name:db["structs"][name]},ensure_ascii=False)[:11000])
          print("=== MORE HELDEN SPAWN FUNCTION NAMES ===")
          for line in dump.splitlines():
              if "Function /Script/Helden." in line and any(w in line.lower() for w in ("spawn","enemy","character","cheatmanager")):
                  print(line[:650])
          print("=== CHARACTER DATA SCHEMA ===")
          for name,body in db["structs"].items():
              if name in ("HeldenCharacterData","HeldenCharacterSettings","HeldenCharacterPreset","HeldenCharacterAI") or "CharacterData" in name:
                  print(json.dumps({name:body},ensure_ascii=False)[:8000])
          print("=== CRITICAL FUNCTION SIGNATURES ===")
          lines=dump.splitlines()
          for i,line in enumerate(lines):
              if any(k in line for k in ("Function /Script/Helden.HeldenCheatManager:DebugSpawnCharacter","Function /Script/Helden.HeldenDataSingleton:GetCharacterDataBP","Function /Script/Helden.HeldenEditorFunctions:GetAllCharacterName","Function /Script/Helden.HeldenCharacter:OnRep_CharacterPreset","Function /Script/Helden.HeldenCharacter:OnRep_AppliedCharacterPreset")):
                  print("\\n".join(lines[i:i+12]),flush=True)
          print("=== OTHER CHARACTER DATA FUNCTIONS ===")
          for line in lines:
              if "Function /Script/Helden." in line and any(k in line for k in (":ApplyCharacter",":SetCharacterData",":GetCharacterData",":SetCharacterPreset",":ApplyCharacterPreset",":SetupCharacter",":InitializeCharacter")):
                  print(line[:600])
          print("=== ROT NAME OR CONTENT ===")
          for line in dump.splitlines():
              if "rot" in line.lower() and any(w in line.lower() for w in ("lurker","rotenemy","rotenemy","grainsick")):
                  print(line[:600])
          PY
